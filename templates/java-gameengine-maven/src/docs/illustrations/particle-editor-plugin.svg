<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480">
  <rect width="900" height="480" fill="#f8fafc"/>
  <text x="24" y="38" font-family="Arial" font-size="20" font-weight="bold" fill="#1f2937">ParticleSystem — Level Editor Plugin Panel</text>

  <!-- Editor window border -->
  <rect x="20" y="55" width="860" height="400" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>

  <!-- Properties panel title bar -->
  <rect x="20" y="55" width="860" height="36" rx="8" fill="#1e293b"/>
  <text x="40" y="80" font-family="Arial" font-size="14" fill="#f1f5f9">Properties — ParticleSystem "rain"</text>
  <!-- Tab badges -->
  <rect x="700" y="63" width="80" height="20" rx="4" fill="#3b82f6"/>
  <text x="740" y="78" font-family="Arial" font-size="12" text-anchor="middle" fill="#fff">Emitter</text>
  <rect x="790" y="63" width="80" height="20" rx="4" fill="#334155"/>
  <text x="830" y="78" font-family="Arial" font-size="12" text-anchor="middle" fill="#94a3b8">Scene</text>

  <!-- Left column: sliders / spinners -->
  <text x="40" y="118" font-family="Arial" font-size="13" font-weight="bold" fill="#334155">General</text>

  <!-- Row helper: label + mock control -->
  <!-- Max particles -->
  <text x="40"  y="142" font-family="Arial" font-size="12" fill="#64748b">Max particles</text>
  <rect x="190" y="128" width="100" height="22" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <text x="240" y="144" font-family="Arial" font-size="12" text-anchor="middle" fill="#111827">300</text>

  <!-- Emit rate -->
  <text x="40"  y="170" font-family="Arial" font-size="12" fill="#64748b">Emit rate (p/s)</text>
  <rect x="190" y="156" width="200" height="14" rx="4" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/>
  <rect x="190" y="156" width="120" height="14" rx="4" fill="#3b82f6"/>
  <text x="400" y="168" font-family="Arial" font-size="12" fill="#374151">150</text>

  <!-- Min / Max life -->
  <text x="40"  y="198" font-family="Arial" font-size="12" fill="#64748b">Life (min / max s)</text>
  <rect x="190" y="184" width="80"  height="22" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <text x="230" y="200" font-family="Arial" font-size="12" text-anchor="middle" fill="#111827">1.0</text>
  <text x="278" y="200" font-family="Arial" font-size="12" fill="#94a3b8">/</text>
  <rect x="290" y="184" width="80"  height="22" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <text x="330" y="200" font-family="Arial" font-size="12" text-anchor="middle" fill="#111827">3.0</text>

  <!-- Direction -->
  <text x="40"  y="228" font-family="Arial" font-size="12" fill="#64748b">Direction (°)</text>
  <rect x="190" y="214" width="200" height="14" rx="4" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/>
  <rect x="290" y="214" width="100" height="14" rx="4" fill="#3b82f6"/>
  <text x="400" y="226" font-family="Arial" font-size="12" fill="#374151">90 (↓)</text>

  <!-- Spread -->
  <text x="40"  y="256" font-family="Arial" font-size="12" fill="#64748b">Spread (°)</text>
  <rect x="190" y="242" width="200" height="14" rx="4" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/>
  <rect x="190" y="242" width="10"  height="14" rx="4" fill="#3b82f6"/>
  <text x="400" y="254" font-family="Arial" font-size="12" fill="#374151">3</text>

  <!-- Speed -->
  <text x="40"  y="284" font-family="Arial" font-size="12" fill="#64748b">Speed (min / max)</text>
  <rect x="190" y="270" width="80"  height="22" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <text x="230" y="286" font-family="Arial" font-size="12" text-anchor="middle" fill="#111827">250</text>
  <text x="278" y="286" font-family="Arial" font-size="12" fill="#94a3b8">/</text>
  <rect x="290" y="270" width="80"  height="22" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <text x="330" y="286" font-family="Arial" font-size="12" text-anchor="middle" fill="#111827">450</text>

  <!-- Gravity factor -->
  <text x="40"  y="312" font-family="Arial" font-size="12" fill="#64748b">Gravity factor</text>
  <rect x="190" y="298" width="200" height="14" rx="4" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/>
  <rect x="190" y="298" width="160" height="14" rx="4" fill="#3b82f6"/>
  <text x="400" y="310" font-family="Arial" font-size="12" fill="#374151">0.8</text>

  <!-- Shape -->
  <text x="40"  y="338" font-family="Arial" font-size="12" fill="#64748b">Shape</text>
  <rect x="190" y="324" width="120" height="22" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <text x="245" y="340" font-family="Arial" font-size="12" text-anchor="middle" fill="#111827">LINE ▾</text>

  <!-- Checkboxes -->
  <rect x="190" y="356" width="14" height="14" rx="3" fill="#3b82f6" stroke="#1d4ed8" stroke-width="1"/>
  <text x="192" y="367" font-family="Arial" font-size="10" fill="#fff">✓</text>
  <text x="210" y="368" font-family="Arial" font-size="12" fill="#374151">Fade out</text>
  <rect x="280" y="356" width="14" height="14" rx="3" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <text x="300" y="368" font-family="Arial" font-size="12" fill="#374151">Shrink</text>

  <!-- Divider -->
  <line x1="450" y1="100" x2="450" y2="440" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Right column: colours + preview -->
  <text x="470" y="118" font-family="Arial" font-size="13" font-weight="bold" fill="#334155">Colours</text>

  <!-- Start colour swatch -->
  <text x="470" y="142" font-family="Arial" font-size="12" fill="#64748b">Start colour</text>
  <rect x="600" y="128" width="80" height="22" rx="4" fill="#a0c8ff" stroke="#60a5fa" stroke-width="1"/>
  <text x="640" y="144" font-family="Arial" font-size="11" text-anchor="middle" fill="#1e3a8a">■ #A0C8FF</text>

  <!-- End colour swatch -->
  <text x="470" y="170" font-family="Arial" font-size="12" fill="#64748b">End colour</text>
  <rect x="600" y="156" width="80" height="22" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
  <text x="640" y="172" font-family="Arial" font-size="11" text-anchor="middle" fill="#374151">■ transparent</text>

  <!-- Mini particle preview -->
  <rect x="460" y="195" width="400" height="200" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="660" y="218" font-family="Arial" font-size="12" text-anchor="middle" fill="#64748b">Live preview</text>
  <!-- rain lines preview -->
  <g stroke="#a0c8ff" stroke-width="1.2" opacity="0.7">
    <line x1="490" y1="230" x2="490" y2="248"/>
    <line x1="510" y1="240" x2="510" y2="260"/>
    <line x1="528" y1="225" x2="528" y2="244"/>
    <line x1="548" y1="250" x2="548" y2="270"/>
    <line x1="570" y1="235" x2="570" y2="254"/>
    <line x1="590" y1="245" x2="590" y2="265"/>
    <line x1="612" y1="228" x2="612" y2="248"/>
    <line x1="630" y1="255" x2="630" y2="274"/>
    <line x1="652" y1="238" x2="652" y2="257"/>
    <line x1="672" y1="248" x2="672" y2="268"/>
    <line x1="695" y1="232" x2="695" y2="251"/>
    <line x1="718" y1="260" x2="718" y2="279"/>
    <line x1="738" y1="242" x2="738" y2="262"/>
    <line x1="758" y1="252" x2="758" y2="271"/>
    <line x1="780" y1="235" x2="780" y2="255"/>
    <line x1="838" y1="245" x2="838" y2="264"/>
    <line x1="500" y1="280" x2="500" y2="299"/>
    <line x1="540" y1="295" x2="540" y2="315"/>
    <line x1="580" y1="285" x2="580" y2="304"/>
    <line x1="625" y1="300" x2="625" y2="319"/>
    <line x1="665" y1="290" x2="665" y2="309"/>
    <line x1="708" y1="305" x2="708" y2="324"/>
    <line x1="748" y1="292" x2="748" y2="311"/>
    <line x1="790" y1="308" x2="790" y2="327"/>
    <line x1="830" y1="295" x2="830" y2="314"/>
  </g>

  <!-- Apply button -->
  <rect x="760" y="410" width="100" height="32" rx="6" fill="#3b82f6" stroke="#1d4ed8" stroke-width="1"/>
  <text x="810" y="431" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">Apply</text>
</svg>
