<svg xmlns="http://www.w3.org/2000/svg" width="920" height="320" viewBox="0 0 920 320">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="920" height="320" fill="#f8fafc"/>
  <text x="24" y="34" font-family="Arial" font-size="22" fill="#1f2937">Motion integration</text>

  <rect x="120" y="140" width="90" height="60" fill="#93c5fd" stroke="#1f2937" stroke-width="2"/>
  <text x="128" y="132" font-family="Arial" font-size="15" fill="#334155">position t</text>

  <line x1="220" y1="170" x2="420" y2="170" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="255" y="155" font-family="Arial" font-size="16" fill="#2563eb">v * dt</text>

  <rect x="450" y="140" width="90" height="60" fill="#60a5fa" stroke="#1f2937" stroke-width="2"/>
  <text x="456" y="132" font-family="Arial" font-size="15" fill="#334155">position t+dt</text>

  <text x="24" y="280" font-family="Arial" font-size="16" fill="#334155">x(t+dt)=x(t)+vx*dt, y(t+dt)=y(t)+vy*dt</text>
</svg>
