<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400">
  <rect width="900" height="400" fill="#0d1117"/>

  <!-- Title -->
  <text x="450" y="36" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle" fill="#f0f6fc">
    Particle Effects Showcase
  </text>

  <!-- ── Rain ─────────────────────────────────────────────── -->
  <rect x="20" y="60" width="190" height="300" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="115" y="88" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#93c5fd">Rain</text>
  <!-- streaks -->
  <g stroke="#93c5fd" stroke-width="1.2" opacity="0.75">
    <line x1="50"  y1="100" x2="50"  y2="118"/>
    <line x1="68"  y1="110" x2="68"  y2="130"/>
    <line x1="85"  y1="95"  x2="85"  y2="113"/>
    <line x1="100" y1="120" x2="100" y2="140"/>
    <line x1="120" y1="105" x2="120" y2="124"/>
    <line x1="138" y1="90"  x2="138" y2="110"/>
    <line x1="155" y1="115" x2="155" y2="135"/>
    <line x1="172" y1="102" x2="172" y2="122"/>
    <line x1="55"  y1="145" x2="55"  y2="163"/>
    <line x1="80"  y1="155" x2="80"  y2="174"/>
    <line x1="105" y1="140" x2="105" y2="159"/>
    <line x1="130" y1="160" x2="130" y2="179"/>
    <line x1="160" y1="148" x2="160" y2="167"/>
    <line x1="60"  y1="185" x2="60"  y2="204"/>
    <line x1="95"  y1="200" x2="95"  y2="219"/>
    <line x1="140" y1="190" x2="140" y2="209"/>
    <line x1="175" y1="205" x2="175" y2="224"/>
    <line x1="45"  y1="225" x2="45"  y2="243"/>
    <line x1="115" y1="230" x2="115" y2="249"/>
    <line x1="165" y1="240" x2="165" y2="258"/>
  </g>
  <text x="115" y="355" font-family="Arial" font-size="12" text-anchor="middle" fill="#64748b">direction=↓ · shape=LINE</text>

  <!-- ── Snow ─────────────────────────────────────────────── -->
  <rect x="230" y="60" width="190" height="300" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="325" y="88" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#e0f2fe">Snow</text>
  <!-- circles -->
  <g fill="#e0f2fe">
    <circle cx="260" cy="110" r="4" opacity="0.9"/>
    <circle cx="285" cy="135" r="3" opacity="0.7"/>
    <circle cx="310" cy="100" r="5" opacity="0.8"/>
    <circle cx="340" cy="125" r="3" opacity="0.85"/>
    <circle cx="360" cy="108" r="4" opacity="0.6"/>
    <circle cx="395" cy="120" r="3" opacity="0.75"/>
    <circle cx="270" cy="160" r="5" opacity="0.7"/>
    <circle cx="300" cy="175" r="2" opacity="0.9"/>
    <circle cx="325" cy="155" r="4" opacity="0.65"/>
    <circle cx="355" cy="170" r="3" opacity="0.8"/>
    <circle cx="385" cy="145" r="5" opacity="0.5"/>
    <circle cx="255" cy="205" r="3" opacity="0.85"/>
    <circle cx="290" cy="215" r="5" opacity="0.7"/>
    <circle cx="320" cy="200" r="2" opacity="0.9"/>
    <circle cx="350" cy="220" r="4" opacity="0.6"/>
    <circle cx="380" cy="195" r="3" opacity="0.75"/>
    <circle cx="265" cy="255" r="4" opacity="0.5"/>
    <circle cx="310" cy="245" r="3" opacity="0.8"/>
    <circle cx="360" cy="260" r="5" opacity="0.55"/>
    <circle cx="400" cy="240" r="2" opacity="0.9"/>
  </g>
  <text x="325" y="355" font-family="Arial" font-size="12" text-anchor="middle" fill="#64748b">sinusoidal drift · shape=CIRCLE</text>

  <!-- ── Fountain ───────────────────────────────────────────── -->
  <rect x="440" y="60" width="190" height="300" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="535" y="88" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#67e8f9">Fountain</text>
  <!-- arcs -->
  <g fill="none" stroke="#67e8f9" stroke-width="1.5">
    <path d="M535,330 Q510,230 490,290" opacity="0.7"/>
    <path d="M535,330 Q520,200 515,270" opacity="0.8"/>
    <path d="M535,330 Q535,170 535,250" opacity="0.9"/>
    <path d="M535,330 Q548,200 555,275" opacity="0.8"/>
    <path d="M535,330 Q560,230 580,295" opacity="0.7"/>
    <path d="M535,330 Q505,250 495,310" opacity="0.5"/>
    <path d="M535,330 Q545,160 540,240" opacity="0.6"/>
    <path d="M535,330 Q565,250 575,315" opacity="0.5"/>
  </g>
  <!-- droplets -->
  <g fill="#67e8f9" opacity="0.85">
    <circle cx="510" cy="295" r="3"/>
    <circle cx="520" cy="260" r="3"/>
    <circle cx="535" cy="240" r="3"/>
    <circle cx="550" cy="260" r="3"/>
    <circle cx="558" cy="290" r="3"/>
  </g>
  <text x="535" y="355" font-family="Arial" font-size="12" text-anchor="middle" fill="#64748b">direction=↑ · gravityFactor=1</text>

  <!-- ── Torch ───────────────────────────────────────────────── -->
  <rect x="650" y="60" width="215" height="300" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="757" y="88" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#fb923c">Torch</text>
  <!-- flame blobs -->
  <g opacity="0.9">
    <ellipse cx="757" cy="290" rx="22" ry="18" fill="#dc2626"/>
    <ellipse cx="757" cy="265" rx="18" ry="22" fill="#ea580c"/>
    <ellipse cx="754" cy="238" rx="14" ry="20" fill="#f97316"/>
    <ellipse cx="758" cy="212" rx="10" ry="18" fill="#fb923c"/>
    <ellipse cx="755" cy="185" rx="7"  ry="15" fill="#fbbf24"/>
    <ellipse cx="757" cy="163" rx="4"  ry="10" fill="#fef08a" opacity="0.7"/>
    <!-- side flickers -->
    <ellipse cx="740" cy="255" rx="8"  ry="12" fill="#ea580c" opacity="0.6"/>
    <ellipse cx="775" cy="248" rx="7"  ry="11" fill="#f97316" opacity="0.5"/>
    <ellipse cx="745" cy="225" rx="6"  ry="9"  fill="#fb923c" opacity="0.45"/>
    <ellipse cx="770" cy="220" rx="5"  ry="8"  fill="#fbbf24" opacity="0.4"/>
  </g>
  <!-- stem -->
  <rect x="748" y="305" width="18" height="40" rx="3" fill="#78350f"/>
  <text x="757" y="355" font-family="Arial" font-size="12" text-anchor="middle" fill="#64748b">buoyancy · shrink · flicker</text>
</svg>
