<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560"
     font-family="Segoe UI, Arial, sans-serif">

  <!-- Background -->
  <rect width="900" height="560" rx="12" fill="#1a1a2e"/>

  <!-- Title -->
  <text x="450" y="38" text-anchor="middle" font-size="18" font-weight="bold" fill="#e0e0f0">
    Scene Roles in a Game Engine
  </text>

  <!-- ─── DemoApp central hub ─── -->
  <rect x="370" y="210" width="160" height="56" rx="10" fill="#3a3a6a" stroke="#7878cc" stroke-width="2"/>
  <text x="450" y="236" text-anchor="middle" font-size="13" font-weight="bold" fill="#c8c8ff">DemoApp</text>
  <text x="450" y="254" text-anchor="middle" font-size="10" fill="#9090cc">scene controller</text>

  <!-- ─── TitleScene (top-left) ─── -->
  <rect x="40" y="60" width="150" height="70" rx="8" fill="#1e3a5f" stroke="#4a90d9" stroke-width="1.5"/>
  <text x="115" y="84" text-anchor="middle" font-size="12" font-weight="bold" fill="#6ab4f5">TitleScene</text>
  <text x="115" y="100" text-anchor="middle" font-size="9" fill="#8abcd9">Logo · splash animation</text>
  <text x="115" y="116" text-anchor="middle" font-size="9" fill="#8abcd9">No physics · any key</text>

  <!-- ─── MenuScene (top-center) ─── -->
  <rect x="220" y="60" width="150" height="70" rx="8" fill="#1e3a5f" stroke="#4a90d9" stroke-width="1.5"/>
  <text x="295" y="84" text-anchor="middle" font-size="12" font-weight="bold" fill="#6ab4f5">MenuScene</text>
  <text x="295" y="100" text-anchor="middle" font-size="9" fill="#8abcd9">Menu items · cursor</text>
  <text x="295" y="116" text-anchor="middle" font-size="9" fill="#8abcd9">No physics · arrows</text>

  <!-- ─── GameScene (top-right area) ─── -->
  <rect x="530" y="60" width="150" height="70" rx="8" fill="#1a3a1a" stroke="#4ab04a" stroke-width="1.5"/>
  <text x="605" y="84" text-anchor="middle" font-size="12" font-weight="bold" fill="#6ad96a">GameScene</text>
  <text x="605" y="100" text-anchor="middle" font-size="9" fill="#8abf8a">Player · enemies · terrain</text>
  <text x="605" y="116" text-anchor="middle" font-size="9" fill="#8abf8a">Full physics · full input</text>

  <!-- ─── LoadingScene (far right top) ─── -->
  <rect x="710" y="60" width="150" height="70" rx="8" fill="#2a2a1e" stroke="#d9c94a" stroke-width="1.5"/>
  <text x="785" y="84" text-anchor="middle" font-size="12" font-weight="bold" fill="#f5e06a">LoadingScene</text>
  <text x="785" y="100" text-anchor="middle" font-size="9" fill="#c8b86a">Progress bar entity</text>
  <text x="785" y="116" text-anchor="middle" font-size="9" fill="#c8b86a">No physics · auto-switch</text>

  <!-- ─── PauseScene (bottom-left) ─── -->
  <rect x="40" y="410" width="150" height="70" rx="8" fill="#3a1e1e" stroke="#d94a4a" stroke-width="1.5"/>
  <text x="115" y="434" text-anchor="middle" font-size="12" font-weight="bold" fill="#f56a6a">PauseScene</text>
  <text x="115" y="450" text-anchor="middle" font-size="9" fill="#c88a8a">Overlay · resume/quit</text>
  <text x="115" y="466" text-anchor="middle" font-size="9" fill="#c88a8a">Physics frozen · Esc/P</text>

  <!-- ─── InventoryScene (bottom-center-left) ─── -->
  <rect x="220" y="410" width="150" height="70" rx="8" fill="#2a1e3a" stroke="#9a4ad9" stroke-width="1.5"/>
  <text x="295" y="434" text-anchor="middle" font-size="12" font-weight="bold" fill="#c06af5">InventoryScene</text>
  <text x="295" y="450" text-anchor="middle" font-size="9" fill="#a88abf">Item grid · slot entities</text>
  <text x="295" y="466" text-anchor="middle" font-size="9" fill="#a88abf">No physics · D-pad</text>

  <!-- ─── GameOverScene (bottom-center-right) ─── -->
  <rect x="530" y="410" width="150" height="70" rx="8" fill="#3a1e1e" stroke="#d97a4a" stroke-width="1.5"/>
  <text x="605" y="434" text-anchor="middle" font-size="12" font-weight="bold" fill="#f59a6a">GameOverScene</text>
  <text x="605" y="450" text-anchor="middle" font-size="9" fill="#c89a78">Score display</text>
  <text x="605" y="466" text-anchor="middle" font-size="9" fill="#c89a78">No physics · any key</text>

  <!-- ─── CreditsScene (far right bottom) ─── -->
  <rect x="710" y="410" width="150" height="70" rx="8" fill="#1e2a2a" stroke="#4ac8c8" stroke-width="1.5"/>
  <text x="785" y="434" text-anchor="middle" font-size="12" font-weight="bold" fill="#6af0f0">CreditsScene</text>
  <text x="785" y="450" text-anchor="middle" font-size="9" fill="#7abfbf">Scrolling text entities</text>
  <text x="785" y="466" text-anchor="middle" font-size="9" fill="#7abfbf">Scroll velocity · skip key</text>

  <!-- ─── BaseScene + Scene labels ─── -->
  <rect x="340" y="310" width="220" height="56" rx="8" fill="#252545" stroke="#5555aa" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="450" y="334" text-anchor="middle" font-size="11" font-weight="bold" fill="#9090dd">BaseScene</text>
  <text x="450" y="352" text-anchor="middle" font-size="9" fill="#7070aa">entities · entitiesMap · world</text>
  <text x="450" y="366" text-anchor="middle" font-size="9" fill="#7070aa">add(entity) · getEntity(name)</text>

  <!-- ─── Connector lines: DemoApp → scenes (top) ─── -->
  <!-- TitleScene -->
  <line x1="370" y1="228" x2="190" y2="95" stroke="#4a90d9" stroke-width="1" stroke-dasharray="4,3" opacity="0.7"/>
  <!-- MenuScene -->
  <line x1="390" y1="215" x2="295" y2="130" stroke="#4a90d9" stroke-width="1" stroke-dasharray="4,3" opacity="0.7"/>
  <!-- GameScene -->
  <line x1="510" y1="215" x2="605" y2="130" stroke="#4ab04a" stroke-width="1" stroke-dasharray="4,3" opacity="0.7"/>
  <!-- LoadingScene -->
  <line x1="530" y1="228" x2="710" y2="95" stroke="#d9c94a" stroke-width="1" stroke-dasharray="4,3" opacity="0.7"/>

  <!-- ─── Connector lines: DemoApp → scenes (bottom) ─── -->
  <!-- PauseScene -->
  <line x1="370" y1="262" x2="190" y2="410" stroke="#d94a4a" stroke-width="1" stroke-dasharray="4,3" opacity="0.7"/>
  <!-- InventoryScene -->
  <line x1="400" y1="266" x2="295" y2="410" stroke="#9a4ad9" stroke-width="1" stroke-dasharray="4,3" opacity="0.7"/>
  <!-- GameOverScene -->
  <line x1="500" y1="266" x2="605" y2="410" stroke="#d97a4a" stroke-width="1" stroke-dasharray="4,3" opacity="0.7"/>
  <!-- CreditsScene -->
  <line x1="530" y1="262" x2="710" y2="410" stroke="#4ac8c8" stroke-width="1" stroke-dasharray="4,3" opacity="0.7"/>

  <!-- ─── DemoApp → BaseScene (inherits) ─── -->
  <line x1="450" y1="266" x2="450" y2="310" stroke="#5555aa" stroke-width="1.5" stroke-dasharray="5,3" opacity="0.8"/>
  <polygon points="450,310 445,300 455,300" fill="#5555aa" opacity="0.8"/>

  <!-- ─── Legend ─── -->
  <rect x="40" y="508" width="820" height="36" rx="6" fill="#111128" stroke="#333366" stroke-width="1"/>
  <line x1="60" y1="526" x2="90" y2="526" stroke="#5555aa" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="96" y="530" font-size="10" fill="#9090cc">extends BaseScene</text>
  <line x1="200" y1="526" x2="230" y2="526" stroke="#4a90d9" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="236" y="530" font-size="10" fill="#8abcd9">managed by DemoApp (UI / menu)</text>
  <line x1="430" y1="526" x2="460" y2="526" stroke="#4ab04a" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="466" y="530" font-size="10" fill="#8abf8a">full physics</text>
  <line x1="560" y1="526" x2="590" y2="526" stroke="#d94a4a" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="596" y="530" font-size="10" fill="#c88a8a">overlay / pause</text>
  <line x1="690" y1="526" x2="720" y2="526" stroke="#d9c94a" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="726" y="530" font-size="10" fill="#c8b86a">utility / transition</text>
</svg>
