<svg xmlns="http://www.w3.org/2000/svg" width="980" height="360" viewBox="0 0 980 360">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="980" height="360" fill="#f8fafc"/>
  <text x="24" y="36" font-family="Arial" font-size="24" fill="#0f172a">PhysicsEngine to CollisionEngine chaining</text>

  <rect x="70" y="90" width="260" height="180" rx="12" fill="#dbeafe" stroke="#1e3a8a" stroke-width="2"/>
  <text x="98" y="122" font-family="Arial" font-size="20" fill="#1e3a8a">Phase 1: Integration</text>
  <text x="95" y="155" font-family="Arial" font-size="15" fill="#0f172a">- gravity</text>
  <text x="95" y="180" font-family="Arial" font-size="15" fill="#0f172a">- damping (friction)</text>
  <text x="95" y="205" font-family="Arial" font-size="15" fill="#0f172a">- update position</text>
  <text x="95" y="230" font-family="Arial" font-size="15" fill="#0f172a">- contain in world</text>

  <line x1="340" y1="180" x2="470" y2="180" stroke="#1d4ed8" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="355" y="165" font-family="Arial" font-size="14" fill="#1d4ed8">intermediate state</text>

  <rect x="500" y="90" width="300" height="180" rx="12" fill="#fee2e2" stroke="#991b1b" stroke-width="2"/>
  <text x="525" y="122" font-family="Arial" font-size="20" fill="#991b1b">Phase 2: Collisions</text>
  <text x="525" y="155" font-family="Arial" font-size="15" fill="#0f172a">- detect AABB overlaps</text>
  <text x="525" y="180" font-family="Arial" font-size="15" fill="#0f172a">- separate entities</text>
  <text x="525" y="205" font-family="Arial" font-size="15" fill="#0f172a">- correct velocities (mass, restitution)</text>
  <text x="525" y="230" font-family="Arial" font-size="15" fill="#0f172a">- apply tangential friction</text>

  <line x1="810" y1="180" x2="930" y2="180" stroke="#1d4ed8" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="822" y="165" font-family="Arial" font-size="14" fill="#1d4ed8">final state</text>

  <text x="24" y="325" font-family="Arial" font-size="16" fill="#334155">Goal: clearly separate individual motion (phase 1) from inter-entity interactions (phase 2).</text>
</svg>
