<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="360" fill="#f0fdf4"/>
  <text x="24" y="34" font-family="Arial" font-size="22" fill="#14532d">Containment within World</text>

  <rect x="120" y="70" width="640" height="220" fill="#dcfce7" stroke="#166534" stroke-width="3"/>
  <text x="132" y="94" font-family="Arial" font-size="16" fill="#166534">World bounds</text>

  <rect x="640" y="210" width="90" height="60" fill="#93c5fd" stroke="#1f2937" stroke-width="2"/>
  <text x="650" y="246" font-family="Arial" font-size="14" fill="#111827">Entity</text>

  <line x1="730" y1="240" x2="790" y2="240" stroke="#1d4ed8" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="736" y="228" font-family="Arial" font-size="14" fill="#1d4ed8">vx</text>

  <line x1="790" y1="240" x2="734" y2="240" stroke="#ef4444" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="794" y="228" font-family="Arial" font-size="14" fill="#ef4444">bounce</text>

  <text x="24" y="320" font-family="Arial" font-size="15" fill="#334155">If a boundary is crossed: clamp position + invert velocity on impact axis</text>
</svg>
