<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#1f6feb"/>
    </marker>
    <marker id="arrg" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#16a34a"/>
    </marker>
    <marker id="arro" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#d97706"/>
    </marker>
  </defs>
  <rect width="900" height="520" fill="#f7f9fc"/>
  <text x="24" y="38" font-family="Arial" font-size="22" font-weight="bold" fill="#1f2937">ParticleSystem — Architecture Overview</text>

  <!-- ParticleSystem entity -->
  <rect x="330" y="70" width="230" height="70" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="445" y="102" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#1e3a8a">ParticleSystem</text>
  <text x="445" y="124" font-family="Arial" font-size="13" text-anchor="middle" fill="#374151">physicsType = STATIC</text>

  <!-- Particle pool -->
  <rect x="570" y="190" width="200" height="80" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="670" y="220" font-family="Arial" font-size="15" font-weight="bold" text-anchor="middle" fill="#14532d">Particle[ ] pool</text>
  <text x="670" y="242" font-family="Arial" font-size="12" text-anchor="middle" fill="#374151">alive · x,y · vx,vy · life</text>
  <text x="670" y="258" font-family="Arial" font-size="12" text-anchor="middle" fill="#374151">size · alpha · color · data</text>

  <!-- Arrow PS → Pool -->
  <line x1="560" y1="200" x2="571" y2="210" stroke="#16a34a" stroke-width="2" marker-end="url(#arrg)"/>
  <line x1="490" y1="140" x2="600" y2="192" stroke="#16a34a" stroke-width="2" marker-end="url(#arrg)"/>
  <text x="545" y="175" font-family="Arial" font-size="12" fill="#16a34a">owns</text>

  <!-- EmitterConfig -->
  <rect x="100" y="190" width="210" height="130" rx="8" fill="#fef9c3" stroke="#b45309" stroke-width="2"/>
  <text x="205" y="216" font-family="Arial" font-size="15" font-weight="bold" text-anchor="middle" fill="#78350f">EmitterConfig</text>
  <text x="205" y="237" font-family="Arial" font-size="12" text-anchor="middle" fill="#374151">emitRate · minLife / maxLife</text>
  <text x="205" y="253" font-family="Arial" font-size="12" text-anchor="middle" fill="#374151">direction · spread</text>
  <text x="205" y="269" font-family="Arial" font-size="12" text-anchor="middle" fill="#374151">minSpeed / maxSpeed</text>
  <text x="205" y="285" font-family="Arial" font-size="12" text-anchor="middle" fill="#374151">gravityFactor · windX/Y</text>
  <text x="205" y="301" font-family="Arial" font-size="12" text-anchor="middle" fill="#374151">startColor → endColor</text>

  <!-- Arrow PS → Config -->
  <line x1="370" y1="140" x2="260" y2="192" stroke="#d97706" stroke-width="2" marker-end="url(#arro)"/>
  <text x="285" y="175" font-family="Arial" font-size="12" fill="#d97706">config</text>

  <!-- Behaviors box -->
  <rect x="310" y="360" width="270" height="120" rx="8" fill="#fce7f3" stroke="#9d174d" stroke-width="2"/>
  <text x="445" y="385" font-family="Arial" font-size="15" font-weight="bold" text-anchor="middle" fill="#831843">ParticleEmitterBehavior</text>
  <text x="445" y="407" font-family="Arial" font-size="12" text-anchor="middle" fill="#374151">RainBehavior</text>
  <text x="445" y="423" font-family="Arial" font-size="12" text-anchor="middle" fill="#374151">SnowBehavior</text>
  <text x="445" y="439" font-family="Arial" font-size="12" text-anchor="middle" fill="#374151">FountainBehavior · TorchBehavior</text>
  <text x="445" y="458" font-family="Arial" font-size="12" text-anchor="middle" fill="#6b7280">spawnParticle() · updateParticle()</text>

  <!-- Arrow PS → Behaviors -->
  <line x1="445" y1="140" x2="445" y2="360" stroke="#9d174d" stroke-width="2" marker-end="url(#arr)"/>
  <text x="455" y="260" font-family="Arial" font-size="12" fill="#9d174d">behaviors</text>

  <!-- PhysicsEngine note -->
  <rect x="20" y="60" width="270" height="60" rx="6" fill="#e0f2fe" stroke="#0369a1" stroke-width="1" stroke-dasharray="5,3"/>
  <text x="155" y="88" font-family="Arial" font-size="13" text-anchor="middle" fill="#0c4a6e">PhysicsEngine skips gravity</text>
  <text x="155" y="108" font-family="Arial" font-size="13" text-anchor="middle" fill="#0c4a6e">→ calls entity.update() only</text>

  <!-- Renderer note -->
  <rect x="610" y="60" width="260" height="60" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="1" stroke-dasharray="5,3"/>
  <text x="740" y="88" font-family="Arial" font-size="13" text-anchor="middle" fill="#4c1d95">ParticleSystemRenderer</text>
  <text x="740" y="108" font-family="Arial" font-size="13" text-anchor="middle" fill="#4c1d95">iterates pool, draws shapes</text>
</svg>
