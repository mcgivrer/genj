[package]
name = "genj"
version = "1.3.1"
edition = "2021"
authors = ["Frederic Delorme <frederic.delorme@gmail.com>"]
license-file = "LICENSE"
description = "Generate a Java project from a template (ZIP file or folder)"
repository = "https://github.com/mcgivrer/genj"
homepage = "https://github.com/mcgivrer/genj"
documentation = "https://github.com/mcgivrer/genj#readme"
keywords = ["java", "project", "generator", "template", "maven", "gradle"]
categories = ["development-tools", "command-line-utilities"]
readme = "README.md"
build = "build.rs"

[[bin]]
name = "genj"
path = "src/main.rs"

# ─── Packaging : formats par défaut par OS ────────────────────────────────────
# mkpkg lit cette section pour décider quels formats construire.
# Surcharge possible avec : cargo run --release --bin mkpkg -- --format <fmt>
[package.metadata.package]
linux   = ["deb", "rpm", "zip"]
macos   = ["dmg", "zip"]
windows = ["msi", "zip"]

# ─── Packaging : cargo-deb (Debian/Ubuntu) ────────────────────────────────────
[package.metadata.deb]
maintainer = "Frédéric Delorme <frederic.delorme@gmail.com>"
copyright = "2024, Frédéric Delorme <frederic.delorme@gmail.com>"
license-file = ["LICENSE", "0"]
extended-description = """\
Generate a Java project from a template (ZIP file or folder). \
Supports variable replacement, Maven/Gradle build tools, \
VSCode configuration, Git setup, and SDKMan integration."""
depends = "$auto"
section = "devel"
priority = "optional"
assets = [
    ["target/release/genj", "usr/bin/", "755"],
    ["docs/man/man1/genj.1", "usr/share/man/man1/genj.1.gz", "644"],
    ["docs/man/man5/genj-template.5", "usr/share/man/man5/genj-template.5.gz", "644"],
    ["target/release-templates/*.zip", "usr/share/genj/templates/", "644"],
    ["README.md", "usr/share/doc/genj/README.md", "644"],
    ["docs/genj.metainfo.xml", "usr/share/metainfo/genj.metainfo.xml", "644"],
]
maintainer-scripts = "debian/"

# ─── Packaging : cargo-generate-rpm (Fedora/RHEL/openSUSE) ───────────────────
[package.metadata.generate-rpm]
assets = [
    { source = "target/release/genj", dest = "/usr/bin/genj", mode = "0755", user = "root", group = "root" },
    { source = "docs/man/man1/genj.1", dest = "/usr/share/man/man1/genj.1.gz", mode = "0644", user = "root", group = "root", doc = true },
    { source = "docs/man/man5/genj-template.5", dest = "/usr/share/man/man5/genj-template.5.gz", mode = "0644", user = "root", group = "root", doc = true },
    { source = "target/release-templates/", dest = "/usr/share/genj/templates/", mode = "0644", user = "root", group = "root" },
    { source = "README.md", dest = "/usr/share/doc/genj/README.md", mode = "0644", user = "root", group = "root", doc = true },
    { source = "docs/genj.metainfo.xml", dest = "/usr/share/metainfo/genj.metainfo.xml", mode = "0644", user = "root", group = "root" },
]

[package.metadata.generate-rpm.requires]
glibc = ">= 2.17"

[dependencies]
clap = { version = "4", features = ["derive"] }
zip = "0.6"
walkdir = "2.3"
chrono = "*"
git2 = "0.18"
serde_json = "1.0"
dirs = "6.0.0"
